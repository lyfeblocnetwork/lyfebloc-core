version: '3.5'

services:
  ## INITIALIZE GENESIS AND SECRETS
  init:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile
    command: ["init"]
    volumes:
      - node-1:/lyfebloc-core/data-1
      - node-2:/lyfebloc-core/data-2
      - node-3:/lyfebloc-core/data-3
      - node-4:/lyfebloc-core/data-4
      - node-5:/lyfebloc-core/data-5
      - node-6:/lyfebloc-core/data-6
      - node-7:/lyfebloc-core/data-7
      - node-8:/lyfebloc-core/data-8
      - node-9:/lyfebloc-core/data-9
      - node-10:/lyfebloc-core/data-10
      - genesis:/genesis
    networks:
      - lyfebloc-core-docker
  
  ## RUN NODES
  ## Nodes must have the same names as folders in genesis-legde
  node-1:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile
    command: ["server", "--data-dir", "/data", "--chain", "/genesis/genesis.json", "--grpc-address", "0.0.0.0:9632", "--libp2p", "0.0.0.0:1478", "--jsonrpc", "0.0.0.0:8545", "--prometheus", "0.0.0.0:5001", "--seal"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '10000:9632'
      - '10002:8545'
      - '10003:5001'
    volumes:
      - node-1:/data
      - genesis:/genesis
    networks:
      - lyfebloc-core-docker
    restart: on-failure
    
  node-2:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile
    command: ["server", "--data-dir", "/data", "--chain", "/genesis/genesis.json", "--grpc-address", "0.0.0.0:9632", "--libp2p", "0.0.0.0:1478", "--jsonrpc", "0.0.0.0:8545", "--prometheus", "0.0.0.0:5001", "--seal"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '20000:9632'
      - '20002:8545'
      - '20003:5001'
    volumes:
      - node-2:/data
      - genesis:/genesis
    networks:
      - lyfebloc-core-docker
    restart: on-failure
    
  node-3:
    build:
      context: ../../
      dockerfile: docker/local/Dockerfile

    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '30000:9632'
      - '30002:8545'
      - '30003:5001'
    volumes:
      - node-3:/data
      - genesis:/genesis
    networks:
      - lyfebloc-core-docker
    restart: on-failure
    
